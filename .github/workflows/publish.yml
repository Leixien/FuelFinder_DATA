name: Publish stations.json

# MIMIT times out from GitHub runners since mid-October 2026, so the homelab (deploy/) downloads the CSVs
# and pushes stations.json to the `data` branch. This workflow runs on main, where the github-pages
# environment allows deployments, and only republishes that branch.
on:
  schedule:
    # After the homelab runs (08:45 and 12:00 Italian time); UTC, so one hour later in summer.
    - cron: "15 9 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
          path: public
      - name: Keep only the published file
        run: rm -rf public/.git
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A failed run emails the repository owner: the signal that the homelab stopped publishing.
  freshness:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
      - name: Prices must be recent
        shell: python
        run: |
          import json
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          reference = date.fromisoformat(json.load(open("stations.json"))["prices_reference_date"])
          # Same rule as the apps' "old data" banner: 48 h after the end of the reference day.
          deadline = datetime.combine(reference, datetime.min.time(), ZoneInfo("Europe/Rome")) + timedelta(hours=72)
          now = datetime.now(ZoneInfo("Europe/Rome"))
          print(f"published reference date {reference}, stale after {deadline:%Y-%m-%d %H:%M}")
          if now > deadline:
              raise SystemExit("::error::stations.json is stale: is the homelab publisher running?")
